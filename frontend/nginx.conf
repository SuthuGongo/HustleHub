server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/security-headers.conf;

  # Used by the container health check.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # The API and the chat WebSocket (/api/socket.io) live in the backend container.
  location /api/ {
    proxy_pass http://backend:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
    client_max_body_size 1m;
  }

  # Built files have a hash in their name, so they can be cached for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/security-headers.conf;
    try_files $uri =404;
  }

  # Everything else is the single-page app; React Router decides what to show.
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
    try_files $uri /index.html;
  }
}

# Keeps the WebSocket upgrade for chat, and plain keep-alive for everything else.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}
