name: CodeQL

# GitHub's own static analysis engine - a second, independent tool from the ESLint pass in ci.yml.
# Where ESLint checks style/pattern rules we configured ourselves, CodeQL runs deeper, built-in
# security queries (taint tracking for injection, XSS, hard-coded credentials, etc.) across both
# the backend (Node/Express) and frontend (React) JavaScript. Results land under the repo's
# Security -> Code scanning alerts tab, not in this workflow's own log output.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # A periodic re-scan catches issues newly disclosed in CodeQL's query packs even when nothing
    # in the code itself has changed.
    - cron: '23 4 * * 1'
  workflow_dispatch: {}

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # security-and-quality adds maintainability/reliability queries on top of the default
          # security-extended pack - broader coverage for a student project being reviewed end to end.
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'
